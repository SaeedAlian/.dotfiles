sensors:
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1,2,3,4,5,6,7]
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1,2]
  - hwmon: /sys/class/hwmon
    name: acpitz
    indices: [1]

fans:
  - tpacpi: /proc/acpi/ibm/fan

levels:
  - [0, 0, 55]
  - [1, 55, 60]
  - [3, 60, 70]
  - [5, 70, 75]
  - [level disengaged, 75, 32767]
