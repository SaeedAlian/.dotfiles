sensors:
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1,2,3,4,5,6,7]
  - hwmon: /sys/class/hwmon
    name: nvme
    indices: [1,2]
  - hwmon: /sys/class/hwmon
    name: acpitz
    indices: [1]

fans:
  - tpacpi: /proc/acpi/ibm/fan

levels:
  - ["level auto", 0, 90]
  - ["level disengaged", 90, 32676]
